<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iChat Companion (fallback)</title>
  <style>
    :root {
      --bg: #12151c;
      --panel: #1a2030;
      --ink: #e8ecf4;
      --muted: #8b95a8;
      --accent: #d4a017;
      --line: #2a3348;
      --ok: #3dba7a;
      --bad: #d45454;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #2a3a28 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #3a2a18 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    main {
      width: min(760px, 100%);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }
    h1 { margin: 0; font-size: 1.15rem; letter-spacing: .04em; color: var(--accent); }
    #status { font-size: .85rem; color: var(--muted); }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
    .toolbar {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto;
      gap: .5rem;
      padding: .75rem 1.25rem;
      border-bottom: 1px solid var(--line);
    }
    input, select, button {
      font: inherit;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #0f131c;
      color: var(--ink);
      padding: .55rem .7rem;
    }
    button {
      background: var(--accent);
      color: #1a1200;
      border-color: transparent;
      font-weight: 600;
      cursor: pointer;
    }
    #log {
      height: min(48vh, 400px);
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .65rem;
    }
    .msg { font-size: .95rem; line-height: 1.35; }
    .msg .meta { font-size: .75rem; color: var(--muted); margin-bottom: .15rem; }
    .msg .sender { color: var(--accent); font-weight: 600; }
    .compose {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .5rem;
      padding: .75rem 1.25rem .5rem;
      border-top: 1px solid var(--line);
    }
    .hint {
      padding: 0 1.25rem 1rem;
      font-size: .8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>iChat companion (fallback)</h1>
      <div id="status" class="bad">Disconnected</div>
    </header>
    <div class="toolbar">
      <input id="sender" placeholder="Sender (Name-Realm)" />
      <select id="channel">
        <option value="say">Global Say</option>
        <option value="trade">Global Trade</option>
        <option value="city">Global City</option>
        <option value="room">Global Room</option>
        <option value="whisper">Global Whisper</option>
      </select>
      <input id="room" placeholder="room name / whisper target" />
      <button id="joinBtn" type="button">Join</button>
    </div>
    <div id="log" aria-live="polite"></div>
    <form class="compose" id="form">
      <input id="text" placeholder="Message…" autocomplete="off" maxlength="500" />
      <button type="submit">Send</button>
    </form>
    <p class="hint">
      Stage 1 primary UX is in-game: Chat settings → <strong>GlobalChat</strong>, then /gsay /gtrade /gcity /groom /gwhisper.
      This page is a realtime fallback while the addon Syncs via SavedVariables / Inbox.lua.
    </p>
  </main>
  <script>
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const senderEl = document.getElementById("sender");
    const channelEl = document.getElementById("channel");
    const roomEl = document.getElementById("room");
    const textEl = document.getElementById("text");
    const seen = new Set();

    senderEl.value = localStorage.getItem("ichat.sender") || "Player-Realm";
    channelEl.value = localStorage.getItem("ichat.channel") || "say";
    roomEl.value = localStorage.getItem("ichat.roomExtra") || "general";

    function roomFor(channel, extra) {
      if (channel === "whisper") return "whisper";
      if (channel === "trade") return "global-trade";
      if (channel === "city") return "global-city";
      if (channel === "room") return "room:" + (extra || "general").toLowerCase();
      return "global-say";
    }

    function fmtTime(ts) {
      try { return new Date(ts).toLocaleTimeString(); } catch { return ""; }
    }

    function addMsg(m) {
      const key = m.id || (m.ts + "|" + m.sender + "|" + m.text);
      if (seen.has(key)) return;
      seen.add(key);
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML =
        '<div class="meta"><span class="sender"></span> · <span class="ch"></span> · <span class="ts"></span></div>' +
        '<div class="body"></div>';
      div.querySelector(".sender").textContent = m.sender || "?";
      const label = (m.channel || "?") + (m.target ? " → " + m.target : "") + (m.roomName ? " #" + m.roomName : "");
      div.querySelector(".ch").textContent = label;
      div.querySelector(".ts").textContent = fmtTime(m.ts);
      div.querySelector(".body").textContent = m.text || "";
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(ok, detail) {
      statusEl.className = ok ? "ok" : "bad";
      statusEl.textContent = detail || (ok ? "Connected" : "Disconnected");
    }

    let ws;
    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host);
      ws.onopen = () => {
        const ch = channelEl.value;
        const room = roomFor(ch, roomEl.value);
        setStatus(true, "Connected · " + ch);
        ws.send(JSON.stringify({
          type: "join",
          room,
          channel: ch,
          sender: senderEl.value,
        }));
      };
      ws.onclose = () => {
        setStatus(false, "Reconnecting…");
        setTimeout(connect, 1500);
      };
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "msg") addMsg(msg);
        if (msg.type === "status") {
          setStatus(!!msg.connected, msg.connected
            ? ("Connected · " + (msg.channel || channelEl.value))
            : "Relay down");
        }
        if (msg.type === "error") {
          addMsg({ sender: "system", channel: "system", text: msg.message, ts: Date.now() });
        }
      };
    }

    document.getElementById("joinBtn").onclick = () => {
      localStorage.setItem("ichat.sender", senderEl.value);
      localStorage.setItem("ichat.channel", channelEl.value);
      localStorage.setItem("ichat.roomExtra", roomEl.value);
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          type: "join",
          room: roomFor(channelEl.value, roomEl.value),
          channel: channelEl.value,
          sender: senderEl.value,
        }));
      }
    };

    document.getElementById("form").onsubmit = (e) => {
      e.preventDefault();
      const text = textEl.value.trim();
      if (!text || !ws || ws.readyState !== 1) return;
      const ch = channelEl.value;
      const payload = {
        type: "msg",
        channel: ch,
        room: roomFor(ch, roomEl.value),
        sender: senderEl.value,
        text,
      };
      if (ch === "room") payload.roomName = roomEl.value || "general";
      if (ch === "whisper") payload.target = roomEl.value;
      ws.send(JSON.stringify(payload));
      textEl.value = "";
      textEl.focus();
    };

    connect();
  </script>
</body>
</html>
