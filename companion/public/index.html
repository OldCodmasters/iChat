<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iChat GlobalChat</title>
  <style>
    :root {
      --bg: #0c0e14;
      --panel: #151a24;
      --ink: #e8ecf4;
      --muted: #8b95a8;
      --accent: #d4a017;
      --line: #2a3348;
      --ok: #3dba7a;
      --bad: #d45454;
      --say: #e8e8e8;
      --trade: #ffc04d;
      --city: #4dff8c;
      --room: #66d9ff;
      --whisper: #ff80ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(ellipse 70% 45% at 0% 0%, #243020 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 10%, #3a2814 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 1.25rem;
    }
    main {
      width: min(780px, 100%);
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.4);
      display: flex;
      flex-direction: column;
      min-height: min(80vh, 640px);
    }
    header {
      padding: .9rem 1.15rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }
    h1 { margin: 0; font-size: 1.1rem; letter-spacing: .06em; color: var(--accent); }
    #status { font-size: .82rem; color: var(--muted); }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
    .toolbar {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr auto;
      gap: .45rem;
      padding: .7rem 1.15rem;
      border-bottom: 1px solid var(--line);
    }
    input, select, button {
      font: inherit;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #0f131c;
      color: var(--ink);
      padding: .5rem .65rem;
    }
    button {
      background: var(--accent);
      color: #1a1200;
      border-color: transparent;
      font-weight: 600;
      cursor: pointer;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: .55rem;
      background: rgba(0,0,0,.18);
    }
    .msg { font-size: .92rem; line-height: 1.35; }
    .msg .meta { font-size: .72rem; color: var(--muted); margin-bottom: .12rem; }
    .msg .ch-say { color: var(--say); }
    .msg .ch-trade { color: var(--trade); }
    .msg .ch-city { color: var(--city); }
    .msg .ch-room { color: var(--room); }
    .msg .ch-whisper { color: var(--whisper); }
    .compose {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .45rem;
      padding: .75rem 1.15rem .4rem;
      border-top: 1px solid var(--line);
    }
    .hint {
      padding: 0 1.15rem 1rem;
      font-size: .78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>GlobalChat</h1>
      <div id="status" class="bad">Disconnected</div>
    </header>
    <div class="toolbar">
      <input id="sender" placeholder="Sender (Name-Realm)" />
      <select id="channel">
        <option value="say">Global Say</option>
        <option value="trade">Global Trade</option>
        <option value="city">Global City</option>
        <option value="room">Global Room</option>
        <option value="whisper">Global Whisper</option>
      </select>
      <input id="room" placeholder="room / whisper target" />
      <button id="joinBtn" type="button">Join</button>
    </div>
    <div id="log" aria-live="polite"></div>
    <form class="compose" id="form">
      <input id="text" placeholder="Message (realtime)…" autocomplete="off" maxlength="500" />
      <button type="submit">Send</button>
    </form>
    <p class="hint">
      Live receive/send surface (WebSocket). In-game <code>/gsay</code> etc. reach the relay via chatlog
      <code>fs.watch</code> — no timed SavedVariables sync. Chat settings in WoW still configure GlobalChat types.
    </p>
  </main>
  <script>
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const senderEl = document.getElementById("sender");
    const channelEl = document.getElementById("channel");
    const roomEl = document.getElementById("room");
    const textEl = document.getElementById("text");
    const seen = new Set();

    senderEl.value = localStorage.getItem("ichat.sender") || "Player-Realm";
    channelEl.value = localStorage.getItem("ichat.channel") || "say";
    roomEl.value = localStorage.getItem("ichat.roomExtra") || "general";

    function roomFor(channel, extra) {
      if (channel === "whisper") return "whisper";
      if (channel === "trade") return "global-trade";
      if (channel === "city") return "global-city";
      if (channel === "room") return "room:" + (extra || "general").toLowerCase();
      return "global-say";
    }

    function fmtTime(ts) {
      try { return new Date(ts).toLocaleTimeString(); } catch { return ""; }
    }

    function addMsg(m) {
      const key = m.id || (m.ts + "|" + m.sender + "|" + m.text);
      if (seen.has(key)) return;
      seen.add(key);
      const ch = m.channel || "say";
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML =
        '<div class="meta"><span class="label"></span> · <span class="sender"></span> · <span class="ts"></span></div>' +
        '<div class="body"></div>';
      const label = div.querySelector(".label");
      label.className = "label ch-" + ch;
      let title = "Global " + ch.charAt(0).toUpperCase() + ch.slice(1);
      if (m.target) title += " → " + m.target;
      if (m.roomName) title += " #" + m.roomName;
      label.textContent = title;
      div.querySelector(".sender").textContent = m.sender || "?";
      div.querySelector(".ts").textContent = fmtTime(m.ts);
      div.querySelector(".body").textContent = m.text || "";
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(ok, detail) {
      statusEl.className = ok ? "ok" : "bad";
      statusEl.textContent = detail || (ok ? "Connected" : "Disconnected");
    }

    let ws;
    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host);
      ws.onopen = () => {
        const ch = channelEl.value;
        setStatus(true, "Live · " + ch);
        ws.send(JSON.stringify({
          type: "join",
          room: roomFor(ch, roomEl.value),
          channel: ch,
          sender: senderEl.value,
        }));
      };
      ws.onclose = () => {
        setStatus(false, "Reconnecting…");
        setTimeout(connect, 1200);
      };
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "msg") addMsg(msg);
        if (msg.type === "status") {
          setStatus(!!msg.connected, msg.connected
            ? ("Live · " + (msg.channel || channelEl.value))
            : "Relay down");
        }
        if (msg.type === "error") {
          addMsg({ sender: "system", channel: "say", text: msg.message, ts: Date.now() });
        }
      };
    }

    document.getElementById("joinBtn").onclick = () => {
      localStorage.setItem("ichat.sender", senderEl.value);
      localStorage.setItem("ichat.channel", channelEl.value);
      localStorage.setItem("ichat.roomExtra", roomEl.value);
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          type: "join",
          room: roomFor(channelEl.value, roomEl.value),
          channel: channelEl.value,
          sender: senderEl.value,
        }));
      }
    };

    document.getElementById("form").onsubmit = (e) => {
      e.preventDefault();
      const text = textEl.value.trim();
      if (!text || !ws || ws.readyState !== 1) return;
      const ch = channelEl.value;
      const payload = {
        type: "msg",
        channel: ch,
        room: roomFor(ch, roomEl.value),
        sender: senderEl.value,
        text,
      };
      if (ch === "room") payload.roomName = roomEl.value || "general";
      if (ch === "whisper") payload.target = roomEl.value;
      ws.send(JSON.stringify(payload));
      textEl.value = "";
      textEl.focus();
    };

    connect();
  </script>
</body>
</html>
